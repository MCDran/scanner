<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner with Feedback</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
    }
    h1 {
        color: #333;
    }
    #video {
        width: 100%;
        max-width: 600px;
        height: auto;
        border: 2px solid #333;
        background-color: #000;
    }
    #card {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: none;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 2em;
        text-align: center;
        transition: opacity 0.5s ease-in-out;
    }
    #success-card {
        background-color: green;
    }
    #error-card {
        background-color: red;
    }
    .icon {
        font-size: 5em;
        margin-bottom: 20px;
        cursor: pointer;
    }
    .icon-btn {
        border: none;
        background: none;
        color: white;
        font-size: inherit;
        cursor: pointer;
    }
    </style>
</head>
<body>
    <h1>QR Code Scanner</h1>
    <video id="video" autoplay playsinline></video>
    <div id="card">
        <div id="content">
            <button id="icon-btn" class="icon-btn">
                <div class="icon">✔️</div>
            </button>
            <p id="details"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script>
        const videoElement = document.getElementById('video');
        const canvasElement = document.createElement('canvas'); // Hidden canvas
        const canvasContext = canvasElement.getContext('2d');
        const cardElement = document.getElementById('card');
        const detailsElement = document.getElementById('details');
        const iconButton = document.getElementById('icon-btn');

        let successMode = false; // Flag to track success or failure mode

        // Function to start the camera stream with fallback options
        async function startCamera() {
            try {
                // First, check if camera permissions are available
                const permissions = await navigator.permissions.query({ name: 'camera' });
                console.log('Camera permission status:', permissions.state);
                
                // Try different camera configurations in order of preference
                const cameraConfigs = [
                    // Try back camera first (mobile devices)
                    { video: { facingMode: { exact: "environment" } } },
                    // Fallback to preferred back camera (less strict)
                    { video: { facingMode: "environment" } },
                    // Fallback to any camera with high resolution
                    { video: { width: { ideal: 1280 }, height: { ideal: 720 } } },
                    // Final fallback to any available camera
                    { video: true }
                ];

                let stream = null;
                let lastError = null;

                for (const config of cameraConfigs) {
                    try {
                        console.log('Trying camera config:', config);
                        stream = await navigator.mediaDevices.getUserMedia(config);
                        break; // Success - exit loop
                    } catch (error) {
                        console.warn('Camera config failed:', config, error);
                        lastError = error;
                        continue; // Try next config
                    }
                }

                if (!stream) {
                    throw lastError || new Error('No camera configuration worked');
                }

                // Successfully got camera stream
                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = () => {
                    console.log('Video metadata loaded, starting QR scanning');
                    requestAnimationFrame(scanQRCode);
                };

                // Add stream error handling
                stream.getTracks().forEach(track => {
                    track.onended = () => {
                        console.log('Camera track ended');
                        showCameraError('Camera connection lost. Please refresh the page.');
                    };
                });

            } catch (error) {
                console.error('Camera access failed:', error);
                showCameraError(error);
            }
        }

        // Function to show camera error messages
        function showCameraError(error) {
            let message = 'Camera access failed. ';
            
            if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                message += 'Please allow camera access in your browser settings and refresh the page.';
                
                // For Chrome/Edge on Windows, provide specific instructions
                if (navigator.userAgent.includes('Chrome') || navigator.userAgent.includes('Edge')) {
                    message += '<br><br>For Chrome/Edge:<br>1. Click the camera icon in the address bar<br>2. Select "Always allow"<br>3. Refresh this page';
                }
            } else if (error.name === 'NotFoundError') {
                message += 'No camera found on this device.';
            } else if (error.name === 'NotReadableError') {
                message += 'Camera is being used by another application.';
            } else {
                message += `Error: ${error.message || error}`;
            }

            // Show error in the video area
            videoElement.style.display = 'none';
            const errorDiv = document.createElement('div');
            errorDiv.innerHTML = `
                <div style="padding: 20px; background: #ffebee; border: 2px solid #f44336; border-radius: 8px; margin: 20px;">
                    <h3 style="color: #d32f2f; margin-top: 0;">Camera Access Required</h3>
                    <p style="color: #666;">${message}</p>
                    <button onclick="location.reload()" style="background: #2196f3; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">
                        Try Again
                    </button>
                </div>
            `;
            videoElement.parentNode.insertBefore(errorDiv, videoElement.nextSibling);
        }

        // Function to display the result card
        function showCard(content, success) {
            cardElement.style.display = 'flex';
            successMode = success;
            if (success) {
                cardElement.style.backgroundColor = 'green';
                document.querySelector('.icon').textContent = '✔️';
                iconButton.style.display = 'block'; // Show checkmark button
            } else {
                cardElement.style.backgroundColor = 'red';
                document.querySelector('.icon').textContent = '❌';
                iconButton.style.display = 'none'; // Hide checkmark button
                setTimeout(() => {
                    cardElement.style.display = 'none';
                    requestAnimationFrame(scanQRCode); // Go back to scanning after 5 seconds
                }, 5000); // Auto-hide for error
            }
            detailsElement.innerHTML = content;
        }

        // Function to scan the QR code from the video stream
        function scanQRCode() {
            if (videoElement.videoWidth && videoElement.videoHeight) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
                canvasContext.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

                const imageData = canvasContext.getImageData(0, 0, canvasElement.width, canvasElement.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

                if (code) {
                    const [registrationNumber, email] = code.data.split(':');

                    // Make a fetch request to your server to verify registration
                    fetch('/checkin', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ registrationNumber, email })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            const registrantInfo = `
                                Name: ${data.registrant.name} <br>
                                Number of People: ${data.registrant.name.split(', ').length} <br>
                                Time Slot: ${data.registrant.timeSlot}
                            `;
                            showCard(registrantInfo, true); // Show success card
                        } else {
                            showCard('Registrant not found!', false); // Show error card
                        }
                    })
                    .catch(error => {
                        showCard('Error processing the QR code.', false); // Show error card
                        console.error('Error:', error);
                    });
                } else {
                    requestAnimationFrame(scanQRCode); // Continue scanning
                }
            } else {
                requestAnimationFrame(scanQRCode); // Wait until video is ready
            }
        }

        // Event listener for the checkmark button to hide the success card
        iconButton.addEventListener('click', () => {
            if (successMode) {
                cardElement.style.display = 'none';
                requestAnimationFrame(scanQRCode); // Resume scanning
            }
        });

        // Start the camera when the page loads with user interaction
        window.onload = () => {
            // Check if we're on HTTPS or localhost (required for camera access)
            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                showCameraError('Camera access requires HTTPS or localhost. Please use HTTPS or access via localhost.');
                return;
            }

            // Check if getUserMedia is supported
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showCameraError('Your browser does not support camera access. Please use a modern browser like Chrome, Firefox, or Safari.');
                return;
            }

            // Show a permission request button instead of immediately requesting camera
            const permissionButton = document.createElement('button');
            permissionButton.innerHTML = '📸 Enable Camera for QR Scanning';
            permissionButton.style.cssText = `
                background: #4CAF50; 
                color: white; 
                border: none; 
                padding: 15px 30px; 
                font-size: 18px; 
                border-radius: 8px; 
                cursor: pointer; 
                margin: 20px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            `;
            
            permissionButton.onmouseover = () => permissionButton.style.background = '#45a049';
            permissionButton.onmouseout = () => permissionButton.style.background = '#4CAF50';
            
            permissionButton.onclick = () => {
                permissionButton.remove();
                startCamera();
            };
            
            videoElement.parentNode.insertBefore(permissionButton, videoElement);
        };
    </script>
</body>
</html>
